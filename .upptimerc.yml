owner: hometrace-apps
repo: status

sites:
  # Website
  - name: Homepage
    url: https://www.hometrace.co
    icon: home
  - name: Sign In
    url: https://www.hometrace.co/auth/signin
    icon: key
  - name: Sign Up
    url: https://www.hometrace.co/auth/signup
    icon: user-plus

  # API - Core Health
  - name: API Health
    url: https://www.hometrace.co/api/health
    icon: activity
  - name: Storage Health
    url: https://www.hometrace.co/api/storage/health
    icon: database

  # API - Public Services
  - name: Places API
    url: https://www.hometrace.co/api/places/autocomplete?input=test
    icon: map-pin
  - name: Status Banner
    url: https://www.hometrace.co/api/status/banner
    icon: bell

  # Preview Environment
  - name: Preview
    url: https://preview.hometrace.co
    icon: eye
    headers:
      - "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN"

status-website:
  cname: status.hometrace.co
  baseUrl: /
  name: Hometrace Status
  logoUrl: https://www.hometrace.co/hometrace.svg
  favicon: https://www.hometrace.co/favicon.ico
  theme: hometrace
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://www.hometrace.co/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="https://www.hometrace.co/hometrace.svg">
    <style>
      body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important; font-weight: 600 !important; }
      footer { display: none !important; }
      nav .container { max-width: 900px; }
      .container { max-width: 900px; }
      header img { height: 48px !important; width: auto !important; }
      article { border-radius: 12px !important; }
      .tag { border-radius: 9999px !important; font-weight: 500 !important; }
    </style>

assignees:
  - nickrroberts

workflowSchedule:
  uptime: "*/30 * * * *"
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
