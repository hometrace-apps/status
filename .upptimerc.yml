status-website:
  cname: status.hometrace.co
  baseUrl: /
  name: Hometrace Status
  logoUrl: https://www.hometrace.co/hometrace.svg
  favicon: https://www.hometrace.co/favicon.ico
  theme: hometrace
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://www.hometrace.co/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="https://www.hometrace.co/hometrace.svg">
    <style>
      body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important; font-weight: 600 !important; }
      footer { display: none !important; }
      nav .container { max-width: 900px; }
      .container { max-width: 900px; }
      header img { height: 48px !important; width: auto !important; }
      article { border-radius: 12px !important; cursor: default !important; }
      article.link a::after { display: none !important; }
      article a { pointer-events: none !important; }
      .tag { border-radius: 9999px !important; font-weight: 500 !important; }
      /* Keep incident links clickable */
      article.down-active a { pointer-events: auto !important; cursor: pointer !important; }
    </style>
    <script>
      document.addEventListener('click', function(e) {
        var link = e.target.closest('a[href*="/incident/"]');
        if (link) {
          e.preventDefault();
          var match = link.href.match(/\/incident\/(\d+)/);
          if (match) {
            window.open('https://github.com/hometrace-apps/status/issues/' + match[1], '_blank');
          }
        }
      });
    </script>

assignees:
  - nickrroberts

workflowSchedule:
  uptime: "*/30 * * * *"
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
